name: Build and release Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run offline regression tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -B -m unittest discover -v
      - name: Build EXE with runtime folder and ZIP
        env:
          PYTHONIOENCODING: utf-8
        run: python build_windows.py --clean
      - name: Check packaged assets and Tk without clicking
        env:
          PYTHONIOENCODING: utf-8
        shell: python
        run: |
          import json
          from pathlib import Path
          import subprocess
          result = Path('build/frozen-self-test.json').resolve()
          process = subprocess.run(
              [str(Path('dist/WuwaTappoChestHelper.exe').resolve()), '--self-test', str(result)],
              timeout=90,
          )
          assert process.returncode == 0, f'Self-test exited with {process.returncode}'
          report = json.loads(result.read_text(encoding='utf-8'))
          assert report.get('ok') is True, report
          assert report.get('frozen') is True, report
          assert report.get('template_variants') == 5 and report.get('detected_chests') == 5, report
          assert report.get('default_mode') == 'borderless', report
          assert set(report.get('modes', [])) == {'borderless', 'background', 'visible'}, report
          assert all(report.get('mode_descriptions', {}).get(mode) for mode in report['modes']), report
          print(report)
          # The folder package must start even when TEMP cannot be used.
          import os
          blocked = Path('build/not-a-temp-directory').resolve()
          blocked.write_text('This is a file, not a directory.', encoding='utf-8')
          environment = os.environ.copy()
          environment['TEMP'] = environment['TMP'] = str(blocked)
          blocked_report = Path('build/frozen-blocked-temp.json').resolve()
          process = subprocess.run(
              [str(Path('dist/WuwaTappoChestHelper.exe').resolve()), '--self-test', str(blocked_report)],
              timeout=90, env=environment,
          )
          assert process.returncode == 0, f'Blocked-TEMP self-test exited with {process.returncode}'
          report = json.loads(blocked_report.read_text(encoding='utf-8'))
          assert report.get('ok') is True and report.get('frozen') is True, report
          print(report)
          # Verify the frozen spawn path, Maa DLLs and input-disabled worker.
          for name, child_environment in (
              ('background-self-test.json', os.environ.copy()),
              ('background-blocked-temp.json', environment),
          ):
              destination = Path('build', name).resolve()
              process = subprocess.run(
                  [str(Path('dist/WuwaTappoChestHelper.exe').resolve()), '--background-self-test', str(destination)],
                  timeout=90, env=child_environment,
              )
              assert process.returncode == 0, f'Background self-test exited with {process.returncode}'
              report = json.loads(destination.read_text(encoding='utf-8'))
              assert report.get('ok') is True and report.get('frozen') is True, report
              print(report)
          diagnostic = Path('build/frozen-diagnostics.json').resolve()
          subprocess.run(
              [str(Path('dist/WuwaTappoChestHelper.exe').resolve()), '--diagnose', str(diagnostic), '--mode', 'borderless'],
              timeout=90, check=True,
          )
          report = json.loads(diagnostic.read_text(encoding='utf-8'))
          assert report.get('input_sent') is False, report
          assert report.get('screenshots_saved') is False, report
          assert report.get('reason'), report
          assert {item['variant'] for item in report.get('templates', [])} == {1, 2, 3, 4, 5}, report
          print(report)
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WuwaTappoChestHelper-windows-x64
          path: |
            dist/WuwaTappoChestHelper.exe
            dist/_internal/
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/licenses/
          if-no-files-found: error
      - name: Resolve release tag
        shell: pwsh
        run: |
          $version = python -c "from build_windows import app_version; print(app_version())"
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; preserving its tagged source and assets. Bump APP_VERSION to publish a new release."
            exit 0
          }
          gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "WuwaTappo 宝箱自动领取 $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "Could not create release; check access and release status" }
          $archive = "dist/WuwaTappoChestHelper-$env:RELEASE_TAG-windows-x64.zip"
          $assets = @(Get-Item $archive, 'dist/SHA256SUMS.txt' | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets" }
